<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Image</title>

    <meta name="description" content="A hero block with a background image and a tinted overlay.">

    <link rel="preload" href="assets/img/business.jpg" as="image">

    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>



    <!-- Custom styles -->
    <style type="text/tailwindcss">

        header::before {
            content: "";
            @apply absolute inset-0 bg-black/40;
        }
        
        header { 
            @apply relative
            min-h-[60vh] md:min-h-[80vh]
            bg-[url('assets/img/business.jpg')] bg-cover bg-center
            flex flex-col justify-center
            px-8 lg:px-60 py-12
            text-center;
        }

        header h1 {
            @apply relative z-10
            text-7xl md:text-8xl
            text-white font-bold
            tracking-tight
        }

        header h2 {
            @apply relative z-10
            text-4xl md:text-5xl
            text-white
            text-shadow-lg/30;
        }
        
       

    </style>

</head>


<body>

    <!-- hero block -->
    <header>
        <h1>Jigdensuren</h1>

        <h2>Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

</body>

</html>
